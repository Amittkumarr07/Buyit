<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyit - Order Confirmed</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2a9a534f60.js" crossorigin="anonymous"></script>
</head>

<body>
    <script src="js/layout.js"></script>

    <section>
        <div class="confirmation-card">
            <div class="confirmation-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1>Order Placed Successfully!</h1>
            <p style="margin: 10px 0 20px; color: #555;">
                Thank you for shopping with Buyit.
                A confirmation email has been sent to your registered email address.
            </p>

            <!-- Order details (filled in by the script at the bottom) -->
            <div>
                <div class="detail-row">
                    <span class="detail-label">Order ID</span>
                    <span id="conf-order-id">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Order Date</span>
                    <span id="conf-order-date">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Expected Delivery</span>
                    <span id="conf-delivery-date">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Method</span>
                    <span id="conf-payment">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Delivering to</span>
                    <span id="conf-address">—</span>
                </div>
                <div class="detail-row total-row">
                    <span class="detail-label">Total</span>
                    <span id="conf-total">—</span>
                </div>
            </div>

            <h3 style="margin-top: 20px; text-align: left;">Items Ordered</h3>
            <div id="conf-items-list"></div>

            <div class="confirmation-actions">
                <a href="orders.html" class="btn" style="width: auto; padding: 12px 30px;">View My Orders</a>
                <a href="products.html" class="btn outline-btn" style="width: auto; padding: 12px 30px;">Continue Shopping</a>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script type="module" src="js/auth.js"></script>

    <script>
        // checkout.js saves the order here right before redirecting to this page
        const order = JSON.parse(sessionStorage.getItem('buyit_last_order'));

        if (!order) {
            // Someone opened this page directly without placing an order
            document.querySelector('.confirmation-card').innerHTML = `
                <h2>No recent order found.</h2>
                <a href="index.html" class="btn" style="width: auto; display: inline-block; padding: 10px 30px;">Go Home</a>
            `;
        } else {
            const setText = (id, value) => {
                document.getElementById(id).textContent = value;
            };

            setText('conf-order-id', order.orderId);
            setText('conf-order-date', order.orderDate);
            setText('conf-delivery-date', order.deliveryDate);
            setText('conf-payment', order.paymentMethod);
            setText('conf-address', order.address);
            setText('conf-total', '₹' + Number(order.total).toLocaleString('en-IN'));

            document.getElementById('conf-items-list').innerHTML = order.items.map(item => `
                <div class="conf-item">
                    <img src="${item.image}" alt="">
                    <div>
                        <strong>${esc(item.name)}</strong>
                        <p>Qty: ${item.quantity} | ₹${Number(item.price).toLocaleString('en-IN')} each</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>

</html>
