<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyit - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/2a9a534f60.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Header and footer layout -->
    <script src="js/layout.js"></script>

    <section class="auth-box">
        <h2 style="text-align: center;">Login or Register</h2>

        <form id="auth-form">
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" id="login-btn" class="btn">Login</button>
            <button type="button" id="register-btn" class="btn" style="background: #555;">
                Register New Account
            </button>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

            <button type="button" id="google-login-btn" class="btn" style="background: #4285F4;">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>
        </form>

        <!-- Error massage if the login failed from auth.js -->
        <p id="error-message" style="color: red; text-align: center; margin-top: 15px; display: none;"></p>
    </section>

    <script src="js/script.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
